name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (unix)
        if: runner.os != 'Windows'
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 \
                https://cli.moonbitlang.cn/install/unix.sh -o /tmp/install-moonbit.sh; then
              break
            fi
            echo "download attempt $attempt failed"; sleep 5
          done
          bash /tmp/install-moonbit.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'install-moonbit.ps1'
          $url = 'https://cli.moonbitlang.cn/install/powershell.ps1'
          for ($i = 1; $i -le 3; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $script -UseBasicParsing -TimeoutSec 90
              break
            } catch {
              Write-Host "download attempt $i failed: $($_.Exception.Message)"
              if ($i -eq 3) { throw }
              Start-Sleep -Seconds 5
            }
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File $script
          if ($LASTEXITCODE -ne 0) { throw "MoonBit installer exited with $LASTEXITCODE" }
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Versions
        run: moon version --all

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check --target all

      - name: Test
        run: moon test --target all

      - name: Demo
        run: moon run cmd/main -- demo

      - name: Layout CLI
        run: moon run cmd/main -- layout "option<string>"

      - name: JSON CLI
        run: moon run cmd/main -- json "result<u32, f64>"

      - name: Glue CLI
        run: moon run cmd/main -- glue "option<u32>"

      - name: Interface CLI
        run: |
          moon run cmd/main -- iface "interface x { greet: func(name: string) -> string; }"

      - name: From-JSON CLI
        run: |
          moon run cmd/main -- from-json '{"funcs":[{"name":"greet","params":["string"],"result":"string"}]}'

      - name: Package
        run: moon package --list

      - name: Public interface
        run: |
          moon info
          git diff --exit-code -- '*.mbti'
